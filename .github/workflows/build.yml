name: Android build
run-name: "Android • ${{ inputs.target }} • ${{ inputs.ref || github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        required: true
        default: all
        options:
        - all        # release APK + release AAB + debug APK
        - release    # release APK + release AAB
        - debug      # debug APK only
      publish:
        description: "Publish release APK to a GitHub Release (auto-create tag)"
        type: boolean
        required: false
        default: false
      ref:
        description: "Git ref (branch/tag/sha)"
        required: false
        default: "master"

permissions:
  contents: write

jobs:
  build:
    name: "Build (${{ inputs.target }})"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # The legacy "tools" package (part of the action's default) was removed
        # from Google's SDK repository; AGP downloads whatever else it needs.
        packages: platform-tools

    - name: Configure build
      id: cfg
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          all)
            echo "gradle_tasks=bundleRelease assembleRelease assembleDebug" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "has_debug=true" >> "$GITHUB_OUTPUT"
            echo "needs_signing=true" >> "$GITHUB_OUTPUT"
            ;;
          release)
            echo "gradle_tasks=bundleRelease assembleRelease" >> "$GITHUB_OUTPUT"
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "has_debug=false" >> "$GITHUB_OUTPUT"
            echo "needs_signing=true" >> "$GITHUB_OUTPUT"
            ;;
          debug)
            echo "gradle_tasks=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "has_debug=true" >> "$GITHUB_OUTPUT"
            echo "needs_signing=false" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unknown target: ${{ inputs.target }}" >&2
            exit 1
            ;;
        esac

    - name: Decode keystore from secret
      if: ${{ steps.cfg.outputs.needs_signing == 'true' }}
      shell: bash
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [[ -z "${KEYSTORE_B64}" ]]; then
          echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
          exit 1
        fi
        echo "${KEYSTORE_B64}" | base64 --decode > release.keystore.jks
        echo "KEYSTORE_PATH=${PWD}/release.keystore.jks" >> "$GITHUB_ENV"

    - name: Run unit tests
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        ./gradlew --no-daemon --stacktrace :tunnel:testDebugUnitTest

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        # shellcheck disable=SC2086
        ./gradlew --no-daemon --stacktrace ${{ steps.cfg.outputs.gradle_tasks }}

    - name: Locate built artifacts
      id: locate
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ steps.cfg.outputs.has_release }}" == "true" ]]; then
          # Release APKs are unsigned (no signingConfig in gradle), so AGP
          # names them ui-release-unsigned.apk; apksigner signs it below.
          APK="./ui/build/outputs/apk/release/ui-release-unsigned.apk"
          AAB="./ui/build/outputs/bundle/release/ui-release.aab"
          [[ -s "${APK}" ]] || { echo "Built artifact not found: ${APK}" >&2; exit 1; }
          [[ -s "${AAB}" ]] || { echo "Built artifact not found: ${AAB}" >&2; exit 1; }
          echo "built_apk=${APK}" >> "$GITHUB_OUTPUT"
          echo "built_aab=${AAB}" >> "$GITHUB_OUTPUT"
        fi

        if [[ "${{ steps.cfg.outputs.has_debug }}" == "true" ]]; then
          DEBUG="./ui/build/outputs/apk/debug/ui-debug.apk"
          [[ -s "${DEBUG}" ]] || { echo "Built artifact not found: ${DEBUG}" >&2; exit 1; }
          echo "built_debug=${DEBUG}" >> "$GITHUB_OUTPUT"
        fi

    - name: Sign AAB
      if: ${{ steps.cfg.outputs.has_release == 'true' }}
      id: sign
      shell: bash
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        set -euo pipefail

        AAB="${{ steps.locate.outputs.built_aab }}"
        SIGNED_AAB="${AAB%.aab}-signed.aab"

        if [[ -z "${KEYSTORE_PASSWORD}" || -z "${KEY_PASSWORD}" || -z "${KEY_ALIAS}" ]]; then
          echo "Missing one of secrets: ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS" >&2
          exit 1
        fi

        jarsigner \
          -keystore "${KEYSTORE_PATH}" \
          -storepass "${KEYSTORE_PASSWORD}" \
          -keypass "${KEY_PASSWORD}" \
          -signedjar "${SIGNED_AAB}" \
          "${AAB}" \
          "${KEY_ALIAS}"

        if [[ ! -s "${SIGNED_AAB}" ]]; then
          echo "jarsigner did not produce ${SIGNED_AAB}" >&2
          exit 1
        fi

        echo "signed_aab=${SIGNED_AAB}" >> "$GITHUB_OUTPUT"

    - name: Sign APK
      if: ${{ steps.cfg.outputs.has_release == 'true' }}
      id: sign_apk
      shell: bash
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        set -euo pipefail

        APK="${{ steps.locate.outputs.built_apk }}"
        # AGP names unsigned release APKs ui-release-unsigned.apk; produce a
        # clean ui-release-signed.apk for the signed output.
        BASE="${APK%.apk}"
        BASE="${BASE%-unsigned}"
        SIGNED_APK="${BASE}-signed.apk"

        if [[ -z "${KEYSTORE_PASSWORD}" || -z "${KEY_PASSWORD}" || -z "${KEY_ALIAS}" ]]; then
          echo "Missing one of secrets: ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS" >&2
          exit 1
        fi

        # Locate apksigner from the Android SDK (the build-tools are installed
        # automatically by AGP). Prefer the newest installed build-tools.
        BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null | sort -V | tail -n1)
        if [[ -z "${BUILD_TOOLS}" ]]; then
          echo "No build-tools found under \$ANDROID_HOME/build-tools" >&2
          exit 1
        fi
        APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

        "$APKSIGNER" sign \
          --ks "${KEYSTORE_PATH}" \
          --ks-pass "pass:${KEYSTORE_PASSWORD}" \
          --ks-key-alias "${KEY_ALIAS}" \
          --key-pass "pass:${KEY_PASSWORD}" \
          --out "${SIGNED_APK}" \
          "${APK}"

        if [[ ! -s "${SIGNED_APK}" ]]; then
          echo "apksigner did not produce ${SIGNED_APK}" >&2
          exit 1
        fi

        echo "signed_apk=${SIGNED_APK}" >> "$GITHUB_OUTPUT"

    - name: Upload release AAB
      if: ${{ steps.cfg.outputs.has_release == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: ${{ steps.sign.outputs.signed_aab }}
        if-no-files-found: error

    - name: Upload release APK
      if: ${{ steps.cfg.outputs.has_release == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: ${{ steps.sign_apk.outputs.signed_apk }}
        if-no-files-found: error

    - name: Upload debug APK
      if: ${{ steps.cfg.outputs.has_debug == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: ${{ steps.locate.outputs.built_debug }}
        if-no-files-found: error

    - name: Compute release tag
      if: ${{ inputs.publish == true && steps.cfg.outputs.has_release == 'true' }}
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        DATE=$(git log -1 --format=%cd --date=format:%Y%m%d)
        HASH=$(git rev-parse --short=7 HEAD)
        COUNT=$(git tag | wc -l)
        COUNT=$((COUNT + 1))
        echo "tag=v1.0.${DATE}-${HASH}${COUNT}" >> "$GITHUB_OUTPUT"

    - name: Publish GitHub Release
      if: ${{ inputs.publish == true && steps.cfg.outputs.has_release == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        files: ${{ steps.sign_apk.outputs.signed_apk }}
        generate_release_notes: true
